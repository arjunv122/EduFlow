services:
  - type: web
    name: eduflow-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # You will set this securely in the Render dashboard
      - key: JWT_SECRET
        sync: false # You will set this securely in the Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: EduFlow <noreply@eduflow.com>
      - key: FRONTEND_URL
        sync: false # Usually your deployed frontend URL (e.g. Vercel URL)
